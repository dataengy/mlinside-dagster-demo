[project]
name = "dagster_demo"
version = "0.1.0"
description = "Демо-проект трёх живых демо лекции MLInside про Dagster"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dagster==1.13.20",
    "dagster-dbt",
    "dagster-duckdb",
    "dbt-duckdb",
    "duckdb",
    "mlflow",
    "pandas",
    "pyarrow",
    "scikit-learn",
]

[dependency-groups]
dev = ["dagster-dg-cli", "dagster-webserver"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dagster_demo"]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dagster_demo"
